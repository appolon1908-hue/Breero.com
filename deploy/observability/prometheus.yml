# Scrapes the API over the private network only. /metrics is never routed at the edge;
# the bearer token is a second line of defence, not the first.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: breero-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/breero_metrics_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
