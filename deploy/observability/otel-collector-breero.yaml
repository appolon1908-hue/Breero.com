receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    send_batch_size: 512
    timeout: 5s
  attributes/privacy:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: enduser.id
        action: delete

exporters:
  otlphttp/tempo:
    endpoint: ${env:TEMPO_OTLP_HTTP_ENDPOINT}
    tls:
      insecure: false
    headers:
      Authorization: ${env:TEMPO_AUTHORIZATION}

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/tempo]
