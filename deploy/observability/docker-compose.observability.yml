services:
  api:
    environment:
      METRICS_ENABLED: "true"
      METRICS_PATH: /metrics
      LOG_FORMAT: json
      LOG_LEVEL: ${BREERO_LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${BREERO_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: breero-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${BREERO_OTLP_TRACES_ENDPOINT:?Set BREERO_OTLP_TRACES_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS_FILE: ${BREERO_OTLP_HEADERS_FILE:-}
      OTEL_TRACE_SAMPLE_RATIO: ${BREERO_OTEL_TRACE_SAMPLE_RATIO:-0.10}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    command:
      - /bin/sh
      - -ec
      - >-
        rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
        --proxy-headers --forwarded-allow-ips 172.16.0.0/12
    labels:
      com.codestra.product: breero
      com.codestra.component: api
      com.codestra.observability.logs: "true"
      com.codestra.observability.metrics-path: /metrics

  worker:
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: ${BREERO_LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${BREERO_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: breero-worker
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${BREERO_OTLP_TRACES_ENDPOINT:?Set BREERO_OTLP_TRACES_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS_FILE: ${BREERO_OTLP_HEADERS_FILE:-}
      OTEL_TRACE_SAMPLE_RATIO: ${BREERO_OTEL_TRACE_SAMPLE_RATIO:-0.10}
    labels:
      com.codestra.product: breero
      com.codestra.component: worker
      com.codestra.observability.logs: "true"

  scheduler:
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: ${BREERO_LOG_LEVEL:-INFO}
      OTEL_ENABLED: ${BREERO_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: breero-scheduler
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${BREERO_OTLP_TRACES_ENDPOINT:?Set BREERO_OTLP_TRACES_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS_FILE: ${BREERO_OTLP_HEADERS_FILE:-}
      OTEL_TRACE_SAMPLE_RATIO: ${BREERO_OTEL_TRACE_SAMPLE_RATIO:-0.10}
    labels:
      com.codestra.product: breero
      com.codestra.component: scheduler
      com.codestra.observability.logs: "true"
