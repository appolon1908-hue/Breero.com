name: breero-production

x-app: &app
  image: ${BREERO_PROD_API_IMAGE:?Set immutable BREERO_PROD_API_IMAGE}
  env_file: ${BREERO_PROD_API_ENV:?Set BREERO_PROD_API_ENV}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
  secrets:
    - breero_database_url
    - breero_redis_url
    - breero_jwt_access_secret
    - breero_jwt_refresh_secret
    - breero_geoapify_api_key
    - breero_metrics_token
  environment:
    # prometheus_client aggregates counters across uvicorn workers through this
    # directory. The container is read_only, so it has to live on the tmpfs.
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

services:
  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    profiles: [migration]

  api:
    <<: *app
    container_name: breero-prod-api
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --workers, "2", --proxy-headers, --forwarded-allow-ips, "172.16.0.0/12"]
    expose: ["8000"]
    networks: [edge, private]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    container_name: breero-prod-worker
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=info]
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    container_name: breero-prod-postgres
    env_file: ${BREERO_PROD_POSTGRES_ENV:?Set BREERO_PROD_POSTGRES_ENV}
    restart: unless-stopped
    secrets:
      - breero_postgres_password
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: breero-prod-redis
    env_file: ${BREERO_PROD_REDIS_ENV:?Set BREERO_PROD_REDIS_ENV}
    command:
      - sh
      - -ec
      - |
        REDIS_PASSWORD="$$(cat "$${REDIS_PASSWORD_FILE}")"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    restart: unless-stopped
    secrets:
      - breero_redis_password
    volumes: [redis_data:/data]
    networks: [private]
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$(cat "$${REDIS_PASSWORD_FILE}")" ping 2>/dev/null | grep PONG'
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  edge:
    name: breero_prod_edge
    external: true
  private:
    name: breero_prod_private
    internal: true

volumes:
  postgres_data: {name: breero_prod_postgres_data}
  redis_data: {name: breero_prod_redis_data}

secrets:
  breero_database_url:
    file: ${DATABASE_URL_REFERENCE:?Set DATABASE_URL_REFERENCE}
  breero_redis_url:
    file: ${REDIS_URL_REFERENCE:?Set REDIS_URL_REFERENCE}
  breero_jwt_access_secret:
    file: ${JWT_SECRET_REFERENCE:?Set JWT_SECRET_REFERENCE}
  breero_jwt_refresh_secret:
    file: ${JWT_REFRESH_SECRET_REFERENCE:?Set JWT_REFRESH_SECRET_REFERENCE}
  breero_geoapify_api_key:
    file: ${GEOAPIFY_API_KEY_REFERENCE:?Set GEOAPIFY_API_KEY_REFERENCE}
  breero_metrics_token:
    file: ${METRICS_TOKEN_REFERENCE:?Set METRICS_TOKEN_REFERENCE}
  breero_postgres_password:
    file: ${POSTGRES_PASSWORD_REFERENCE:?Set POSTGRES_PASSWORD_REFERENCE}
  breero_redis_password:
    file: ${REDIS_PASSWORD_REFERENCE:?Set REDIS_PASSWORD_REFERENCE}
