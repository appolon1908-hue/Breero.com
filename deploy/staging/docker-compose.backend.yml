name: breero-staging

x-app: &app
  image: ${BREERO_STAGING_API_IMAGE:?Set an immutable BREERO_STAGING_API_IMAGE}
  env_file: ${BREERO_STAGING_API_ENV:?Set BREERO_STAGING_API_ENV}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [private]
  secrets:
    - breero_staging_database_url
    - breero_staging_redis_url
    - breero_staging_jwt_access_secret
    - breero_staging_jwt_refresh_secret
    - breero_staging_metrics_token
  environment:
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

services:
  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    healthcheck: {disable: true}
    profiles: [migration]

  api:
    <<: *app
    container_name: breero-staging-api
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --workers, "2", --proxy-headers, --forwarded-allow-ips, "172.16.0.0/12"]
    expose: ["8000"]
    networks: [edge, private]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    container_name: breero-staging-worker
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=info]
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    container_name: breero-staging-postgres
    env_file: ${BREERO_STAGING_POSTGRES_ENV:?Set BREERO_STAGING_POSTGRES_ENV}
    restart: unless-stopped
    secrets:
      - breero_staging_postgres_password
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: breero-staging-redis
    env_file: ${BREERO_STAGING_REDIS_ENV:?Set BREERO_STAGING_REDIS_ENV}
    command:
      - sh
      - -ec
      - |
        REDIS_PASSWORD="$$(cat "$${REDIS_PASSWORD_FILE}")"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    restart: unless-stopped
    secrets:
      - breero_staging_redis_password
    volumes: [redis_data:/data]
    networks: [private]
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$(cat "$${REDIS_PASSWORD_FILE}")" ping 2>/dev/null | grep PONG'
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  edge:
    name: breero_staging_edge
    external: true
  private:
    name: breero_staging_private
    internal: true

volumes:
  postgres_data: {name: breero_staging_postgres_data}
  redis_data: {name: breero_staging_redis_data}

secrets:
  breero_staging_database_url:
    file: ${STAGING_DATABASE_URL_REFERENCE:?Set STAGING_DATABASE_URL_REFERENCE}
  breero_staging_redis_url:
    file: ${STAGING_REDIS_URL_REFERENCE:?Set STAGING_REDIS_URL_REFERENCE}
  breero_staging_jwt_access_secret:
    file: ${STAGING_JWT_SECRET_REFERENCE:?Set STAGING_JWT_SECRET_REFERENCE}
  breero_staging_jwt_refresh_secret:
    file: ${STAGING_JWT_REFRESH_SECRET_REFERENCE:?Set STAGING_JWT_REFRESH_SECRET_REFERENCE}
  breero_staging_postgres_password:
    file: ${STAGING_POSTGRES_PASSWORD_REFERENCE:?Set STAGING_POSTGRES_PASSWORD_REFERENCE}
  breero_staging_redis_password:
    file: ${STAGING_REDIS_PASSWORD_REFERENCE:?Set STAGING_REDIS_PASSWORD_REFERENCE}
  breero_staging_metrics_token:
    file: ${STAGING_METRICS_TOKEN_REFERENCE:?Set STAGING_METRICS_TOKEN_REFERENCE}
