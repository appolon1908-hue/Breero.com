# Nightly verified dumps for the production host.
#
#   docker compose \
#     -f deploy/production/docker-compose.backend.yml \
#     -f deploy/backup/docker-compose.backup.yml up -d
#
# The image is pinned to the same PostgreSQL major as the server: pg_dump refuses to
# dump a server newer than itself, so a mismatched client is a silent backup outage.
name: breero-production

services:
  backup:
    image: postgis/postgis:17-3.5@sha256:0a23a2b5e4fbd9b4c6980d20ee80dd6b63dec52669379c75a506db58a4116708
    container_name: breero-prod-backup
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "999:999"
    networks: [private]
    environment:
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
      RETENTION_MIN_COPIES: "7"
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    secrets: [breero_database_url]
    volumes:
      - ./../../scripts/backup:/opt/backup:ro
      - backup_data:/backups
    entrypoint:
      - sh
      - -ec
      - |
        DATABASE_URL="$$(cat /run/secrets/breero_database_url)"
        # The application connects with the SQLAlchemy driver prefix; libpq does not
        # understand it and would fail to parse the URL.
        export DATABASE_URL="$${DATABASE_URL#postgresql+psycopg://}"
        export DATABASE_URL="postgresql://$${DATABASE_URL}"
        while true; do
          /opt/backup/backup.sh || echo "backup run failed; retrying at the next interval"
          sleep 86400
        done
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  private:
    name: breero_prod_private
    internal: true

volumes:
  backup_data:
    name: breero_prod_backup_data

secrets:
  breero_database_url:
    file: ${DATABASE_URL_REFERENCE:?Set DATABASE_URL_REFERENCE}
