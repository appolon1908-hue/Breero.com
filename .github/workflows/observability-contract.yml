name: Observability architecture contract
on:
  pull_request:
    paths:
      - deploy/observability/**
      - scripts/observability/**
      - .github/workflows/observability-contract.yml
      - docs/observability-stack.md
  push:
    branches: [main]
    paths:
      - deploy/observability/**
      - scripts/observability/**
      - .github/workflows/observability-contract.yml
      - docs/observability-stack.md
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/observability/validate_contract.py
      - run: python -m unittest discover -s scripts/observability -p 'test_*.py' -v
