name: Generate OpenAPI client contract once

on:
  push:
    branches:
      - fe/generated-openapi-contract

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe/generated-openapi-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[dev]'
      - name: Regenerate canonical OpenAPI
        working-directory: apps/api
        run: python scripts/generate_openapi.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install generator and update frozen lock
        run: pnpm add -Dw --save-exact openapi-typescript@latest
      - name: Generate TypeScript contract
        run: pnpm contract:generate
      - name: Verify generated contract is nonempty
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/api/openapi.json
          test -s packages/types/src/openapi.generated.ts
          grep -q 'export interface paths' packages/types/src/openapi.generated.ts
          grep -q 'export interface components' packages/types/src/openapi.generated.ts
      - name: Commit generated artifacts and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/generate-openapi-types-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "build(types): commit generated OpenAPI contract"
          git push origin HEAD:fe/generated-openapi-contract
