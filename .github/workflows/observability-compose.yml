name: Observability Compose validation
on:
  pull_request:
    paths:
      - deploy/observability/**
      - docker-compose.production.yml
      - .github/workflows/observability-compose.yml
  push:
    branches: [main]
    paths:
      - deploy/observability/**
      - docker-compose.production.yml
      - .github/workflows/observability-compose.yml
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      BREERO_IMAGE: ghcr.io/example/breero-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      BREERO_ENV_FILE: .env.production.example
      CADDY_NETWORK: codestra-caddy-shared
      DATABASE_URL_REFERENCE: /tmp/breero-observability-ci-secret
      REDIS_URL_REFERENCE: /tmp/breero-observability-ci-secret
      JWT_SECRET_REFERENCE: /tmp/breero-observability-ci-secret
      JWT_REFRESH_SECRET_REFERENCE: /tmp/breero-observability-ci-secret
      GEOAPIFY_API_KEY_REFERENCE: /tmp/breero-observability-ci-secret
      POSTGRES_PASSWORD_REFERENCE: /tmp/breero-observability-ci-secret
      REDIS_ACL_FILE_REFERENCE: /tmp/breero-observability-ci-secret
      BREERO_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      BREERO_OTLP_HEADERS_FILE_REFERENCE: /tmp/breero-observability-ci-secret
    steps:
      - uses: actions/checkout@v4
      - name: Create empty validation fixture
        run: touch /tmp/breero-observability-ci-secret
      - name: Validate production overlay without starting services
        run: docker compose -f docker-compose.production.yml -f deploy/observability/docker-compose.observability.yml config --quiet
