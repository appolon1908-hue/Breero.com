name: Bootstrap generated OpenAPI types

on:
  push:
    branches: ["fe/generated-openapi-types"]

permissions:
  contents: write

concurrency:
  group: bootstrap-openapi-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend contract dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade 'pip>=26.1.2'
          pip install -e '.[dev]'
      - name: Regenerate deterministic OpenAPI
        working-directory: apps/api
        run: python scripts/generate_openapi.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Resolve the pinned generator into the lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Generate the committed TypeScript contract
        run: |
          mkdir -p packages/types/src/generated
          pnpm types:generate
      - name: Commit deterministic generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/openapi.json pnpm-lock.yaml packages/types/src/generated/openapi.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current"
            exit 0
          fi
          git commit -m "chore(types): regenerate OpenAPI contract"
          git push
