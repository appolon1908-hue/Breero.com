name: Frontend production gates

on:
  workflow_call:
  push:
    branches: ["main"]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend dependency audit
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract:check
      - run: pnpm build
      - run: pnpm --filter @breero/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @breero/web test:e2e
