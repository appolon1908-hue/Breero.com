name: Apply production scheduler guard

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-scheduler-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'infra/consolidate-production-compose'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add beat startup assertion
        run: python scripts/_apply_scheduler_guard.py
      - name: Parse and whitespace validation
        run: |
          python -m compileall -q apps/api/app apps/api/tests
          git diff --check
      - name: Commit scheduler guard
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm scripts/_apply_scheduler_guard.py
          rm .github/workflows/_apply-scheduler-guard.yml
          git config user.name "codestra-production-bot"
          git config user.email "production-bot@codestra.invalid"
          git add -A
          git commit -m "fix(ops): assert required Celery beat tasks at startup"
          git push origin "HEAD:${BRANCH}"
