name: Runtime Ruff repair

on:
  push:
    branches:
      - be/runtime-resource-lifecycle

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be/runtime-resource-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend development tools
        working-directory: apps/api
        run: python -m pip install -e '.[dev]'
      - name: Apply and verify deterministic Ruff fixes
        working-directory: apps/api
        run: |
          ruff check . --fix
          ruff check .
      - name: Commit repaired source and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/runtime-ruff-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): normalize backend lint after auth synchronization"
          git push origin HEAD:be/runtime-resource-lifecycle
