name: Architecture baseline evidence

on:
  pull_request:
    paths:
      - docs/architecture/**
      - scripts/architecture/**
      - .github/workflows/architecture-inventory.yml
  push:
    branches: [main]
    paths:
      - docs/architecture/**
      - scripts/architecture/**
      - .github/workflows/architecture-inventory.yml

permissions:
  contents: read

jobs:
  architecture-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install inventory runtime
        run: python -m pip install -e 'apps/api[dev]'
      - name: Check inventory code
        run: ruff check --config apps/api/pyproject.toml scripts/architecture
      - name: Verify source and runtime evidence
        run: python scripts/architecture/inventory.py --check
      - name: Verify complete routes and isolated configuration
        run: python -m unittest discover -s scripts/architecture -p 'test_*.py' -v
