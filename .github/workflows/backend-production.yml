name: Backend production gates

on:
  workflow_call:
  push:
    branches: ["main"]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: breero_test
          POSTGRES_USER: breero
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breero -d breero_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://breero:test-only@localhost:5432/breero_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.1.2'
      - run: pip install -e '.[dev]' pip-audit
      - name: Validate production and staging Compose secret contracts
        working-directory: .
        env:
          BREERO_PROD_API_IMAGE: ghcr.io/example/breero-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BREERO_PROD_API_ENV: api.env.example
          BREERO_PROD_POSTGRES_ENV: postgres.env.example
          BREERO_PROD_REDIS_ENV: redis.env.example
          DATABASE_URL_REFERENCE: /tmp/breero-database-url
          REDIS_URL_REFERENCE: /tmp/breero-redis-url
          JWT_SECRET_REFERENCE: /tmp/breero-jwt-access
          JWT_REFRESH_SECRET_REFERENCE: /tmp/breero-jwt-refresh
          GEOAPIFY_API_KEY_REFERENCE: /tmp/breero-geoapify
          METRICS_TOKEN_REFERENCE: /tmp/breero-metrics-token
          POSTGRES_PASSWORD_REFERENCE: /tmp/breero-postgres-password
          REDIS_PASSWORD_REFERENCE: /tmp/breero-redis-password
          BREERO_STAGING_API_IMAGE: ghcr.io/example/breero-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          BREERO_STAGING_API_ENV: api.env.example
          BREERO_STAGING_POSTGRES_ENV: postgres.env.example
          BREERO_STAGING_REDIS_ENV: redis.env.example
          STAGING_DATABASE_URL_REFERENCE: /tmp/breero-staging-database-url
          STAGING_REDIS_URL_REFERENCE: /tmp/breero-staging-redis-url
          STAGING_JWT_SECRET_REFERENCE: /tmp/breero-staging-jwt-access
          STAGING_JWT_REFRESH_SECRET_REFERENCE: /tmp/breero-staging-jwt-refresh
          STAGING_POSTGRES_PASSWORD_REFERENCE: /tmp/breero-staging-postgres-password
          STAGING_REDIS_PASSWORD_REFERENCE: /tmp/breero-staging-redis-password
          STAGING_METRICS_TOKEN_REFERENCE: /tmp/breero-staging-metrics-token
          GRAFANA_PASSWORD_REFERENCE: /tmp/breero-grafana-password
        run: |
          touch /tmp/breero-database-url \
                /tmp/breero-redis-url \
                /tmp/breero-jwt-access \
                /tmp/breero-jwt-refresh \
                /tmp/breero-geoapify \
                /tmp/breero-metrics-token \
                /tmp/breero-postgres-password \
                /tmp/breero-redis-password \
                /tmp/breero-staging-database-url \
                /tmp/breero-staging-redis-url \
                /tmp/breero-staging-jwt-access \
                /tmp/breero-staging-jwt-refresh \
                /tmp/breero-staging-postgres-password \
                /tmp/breero-staging-redis-password \
                /tmp/breero-staging-metrics-token \n                /tmp/breero-grafana-password
          docker compose -f deploy/production/docker-compose.backend.yml config --quiet
          docker compose -f deploy/staging/docker-compose.backend.yml config --quiet
          docker compose -f deploy/observability/docker-compose.observability.yml config --quiet
      - name: Validate Prometheus rules and scrape config
        # Alert rules are code. Without this, a typo in an expression is only
        # discovered when the alert it was supposed to raise fails to fire.
        run: |
          docker run --rm -v "$PWD/deploy/observability:/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules /rules/alerts.yml
        working-directory: .
      - run: ruff check .
      - run: mypy app
      - name: Structural layering contracts
        run: lint-imports
      - name: Router layering ratchet
        run: python scripts/check_layering.py
      - run: alembic upgrade head
      - run: alembic check
      - run: python scripts/check_schema_drift.py
      # The floor is a ratchet, not a target. Raise it to just under the observed
      # figure whenever a run comes in comfortably above it; never lower it.
      - name: Test suite with coverage floor
        run: pytest -q --cov --cov-fail-under=60
      - name: PR 34 P1/P2 repair acceptance
        run: >-
          pytest -q
          tests/integration/test_release_safety_postgres.py
          tests/integration/test_booking_expiry_worker.py
      - name: Capability and disabled-feature guard
        run: >-
          pytest -q
          tests/test_marketplace_release_safety.py
          tests/test_production_config.py
      - name: Canonical, negative, and PostgreSQL concurrency acceptance
        run: >-
          pytest -q
          tests/integration/test_canonical_lifecycle.py
          tests/integration/test_negative_lifecycle.py
          tests/integration/test_postgres_concurrency.py
      - name: Validate upgrade paths from prior canonical and split heads
        env:
          PGPASSWORD: test-only
        run: |
          for scenario in baseline auth finance; do
            createdb -h localhost -U breero "breero_${scenario}"
          done
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_baseline alembic upgrade 005_booking_integrations
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_baseline alembic upgrade head
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_auth alembic upgrade 006_auth_customer_payments
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_auth alembic upgrade head
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_finance alembic upgrade 006_finance_integrations
          DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_finance alembic upgrade head
      - name: Prove a backup can actually be restored
        env:
          PGPASSWORD: test-only
          DATABASE_URL: postgresql://breero:test-only@localhost:5432/breero_test
        # An untested backup is a hypothesis. This takes a real dump of the schema the
        # migrations just built, restores it into a scratch database, and asserts the
        # restore is usable -- so the procedure in docs/backup-and-recovery.md cannot
        # rot unnoticed between incidents.
        run: |
          mkdir -p /tmp/breero-backups
          BACKUP_DIR=/tmp/breero-backups bash ../../scripts/backup/backup.sh
          dump="$(find /tmp/breero-backups -name 'breero-*.dump' | head -n1)"
          createdb -h localhost -U breero breero_restore_drill
          scratch=postgresql://breero:test-only@localhost:5432/breero_restore_drill
          SOURCE_DATABASE_URL="$DATABASE_URL" bash ../../scripts/backup/restore-drill.sh "$dump" "$scratch"
      - name: Reject a corrupt backup
        # The drill is only worth having if it fails when it should.
        env:
          PGPASSWORD: test-only
        run: |
          printf 'not a postgres dump' > /tmp/corrupt.dump
          createdb -h localhost -U breero breero_corrupt_drill
          scratch=postgresql://breero:test-only@localhost:5432/breero_corrupt_drill
          if bash ../../scripts/backup/restore-drill.sh /tmp/corrupt.dump "$scratch"; then
            echo "::error::restore drill accepted a corrupt dump"
            exit 1
          fi
      - name: Prove the documented rollback path is reversible
        env:
          PGPASSWORD: test-only
        # docs/backend-rollback.md rolls the application back one image at a time, so
        # the migration that must be reversible is the newest one. Migration 009 is
        # explicitly never downgraded automatically, so this drill stays at head.
        run: |
          createdb -h localhost -U breero breero_rollback
          export DATABASE_URL=postgresql+psycopg://breero:test-only@localhost:5432/breero_rollback
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - run: python scripts/generate_openapi.py
      - run: test -s openapi.json
      - name: Dependency audit
        run: pip-audit
      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
      - run: docker build -t breero-api:${{ github.sha }} .
        working-directory: apps/api
      - name: Container HIGH/CRITICAL scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: breero-api:${{ github.sha }}
          trivyignores: .trivyignore
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
