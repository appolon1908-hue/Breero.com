name: Regenerate final OpenAPI contract

on:
  push:
    branches:
      - fe/generated-openapi-contract

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe/generated-openapi-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[dev]'
      - name: Generate canonical OpenAPI
        working-directory: apps/api
        run: python scripts/generate_openapi.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate TypeScript contract
        run: pnpm contract:generate
      - name: Validate complete portal path policy
        run: pnpm contract:check:policy
      - name: Verify generated outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/api/openapi.json
          test -s packages/types/src/openapi.generated.ts
          grep -q '"/api/v1/integrations/config"' apps/api/openapi.json
          grep -q '"/api/v1/portal/operations/overview"' apps/api/openapi.json
          grep -q 'export interface paths' packages/types/src/openapi.generated.ts
      - name: Commit final artifacts and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-final-openapi-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated contract changes"; exit 1; }
          git commit -m "build(types): regenerate final portal OpenAPI contract"
          git push origin HEAD:fe/generated-openapi-contract
